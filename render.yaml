# Render Blueprint: one Docker web service that serves the API and the frontend.
# The database is external (e.g. Neon); paste its connection string as DATABASE_URL. See DEPLOYMENT.md.
services:
  - type: web
    name: retailpulse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Your email: you become ADMIN when you sign up or sign in, then control the site from Admin.
      - key: ADMIN_EMAILS
        sync: false
      # Starting value for demo access, used until an admin changes it on the website.
      - key: DEMO_LOGIN_ENABLED
        value: "true"
